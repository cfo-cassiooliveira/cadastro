# Ambiente local do Cadastro: api (BFF .NET) -> web (nginx + Angular).
# Antes da primeira subida: ./scripts/generate-env.sh && ./scripts/identity-network.sh (Keycloak de pé em ../keycloak).
# Uso: docker compose up -d --build   → http://localhost:4300
name: cadastro

services:
  api:
    build:
      context: .
      dockerfile: cadastro-backend/Dockerfile
    # Teto de memória: um serviço não derruba os demais na VM do WSL2 (20 GB, ver ~/.wslconfig).
    mem_limit: 512m
    environment:
      ASPNETCORE_ENVIRONMENT: ${API_ENVIRONMENT:-Production}
      # Discovery e tokens pela rede interna (keycloak:8080); o issuer continua o do navegador (localhost:8180).
      Oidc__MetadataAddress: http://keycloak:8080/realms/workspace/.well-known/openid-configuration
      # HTTP só no ambiente local (Keycloak sem TLS próprio, fora de escopo da spec 001).
      Oidc__RequireHttpsMetadata: "false"
      Oidc__ClientSecret: ${KC_CADASTRO_CLIENT_SECRET:?defina KC_CADASTRO_CLIENT_SECRET no .env (./scripts/generate-env.sh)}
      # Mesmo client: a conta de serviço lê e grava usuários pela Admin API (ADR-0002).
      KeycloakAdmin__ClientSecret: ${KC_CADASTRO_CLIENT_SECRET}
      DataProtection__KeysPath: /keys
      # http://localhost é contexto seguro para o navegador (cookies __Host-/Secure); só neste compose local.
      Bff__LocalSecureContext: "true"
      # Pseudonimização dos logs (ADR-0003 do ../graylog), mesma chave do ../legado. Chaves opcionais aqui (vazia =
      # ausente); a API não sobe sem a chave do CurrentKeyId (fail fast). Rotação: LOG_PSEUDONYMIZATION_KEY_K2 +
      # CURRENT_KEY_ID=k2; a K1 fica no .env até o fim da retenção dos logs (30 dias), porque o Cadastro pesquisa com ela.
      Logging__Pseudonymization__CurrentKeyId: ${LOG_PSEUDONYMIZATION_CURRENT_KEY_ID:-k1}
      Logging__Pseudonymization__Keys__k1: ${LOG_PSEUDONYMIZATION_KEY_K1:-}
      Logging__Pseudonymization__Keys__k2: ${LOG_PSEUDONYMIZATION_KEY_K2:-}
      # Importação (ADR-0007): runtime com o login cadastro_app (sem acesso ao dbo) e chave AES-256 dos dados pessoais.
      ConnectionStrings__ImportDb: ${CADASTRO_APP_CONNECTION:?defina CADASTRO_APP_CONNECTION no .env (./scripts/generate-env.sh)}
      PersonalData__Protection__CurrentKeyVersion: ${PERSONAL_DATA_KEY_VERSION:-k1}
      PersonalData__Protection__Keys__k1: ${PERSONAL_DATA_KEY_K1:?defina PERSONAL_DATA_KEY_K1 no .env (./scripts/generate-env.sh)}
      # Token do resumo do lote (HMAC-SHA256, chave do servidor); a API não sobe sem ela.
      UserImports__SummaryTokenKey: ${USER_IMPORT_SUMMARY_KEY:?defina USER_IMPORT_SUMMARY_KEY no .env (./scripts/generate-env.sh)}
      # Antivírus (C2): clamd por INSTREAM na rede interna; indisponível = upload recusado (fail-closed).
      ClamAv__Host: clamav
      ClamAv__Port: "3310"
      # Relay da outbox (C4): usuário cadastro-app sem configure (a topologia vem do ../rabbitmq); senha só do .env.
      RabbitMq__Host: rabbitmq
      RabbitMq__VirtualHost: dev
      RabbitMq__UserName: cadastro-app
      RabbitMq__Password: ${RABBITMQ_CADASTRO_APP_PASSWORD:?defina RABBITMQ_CADASTRO_APP_PASSWORD no .env (./scripts/generate-env.sh)}
    tmpfs:
      # Arquivos temporários do upload (CSV com dados pessoais em claro durante a requisição) ficam só em memória, nunca em disco.
      - /tmp:size=64m
    volumes:
      # Chaves que cifram o cookie e o antiforgery sobrevivem ao restart do container.
      - api-keys:/keys
    networks:
      default:
        # Alias único e estável na rede do projeto: o `api` também existe no legado_default e o nome do container
        # (cadastro-api-1) muda com projeto/escala. Usado pelo blackbox do ../grafana (ADR-0003 do grafana).
        aliases:
          - cadastro-api
      identity: {}
    # Sem "ports": a API só é acessível pela rede interna, via nginx do frontend.
    healthcheck:
      # A imagem aspnet não traz curl/wget: a sonda usa o /dev/tcp do bash (o /bin/sh da imagem é o dash).
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/live HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  clamav:
    # ClamAV (clamd) para verificar os arquivos de importação; sem porta publicada: só a API o alcança pela rede do projeto.
    image: clamav/clamav:1.4.3@sha256:75fb5fd95fcbe1d7e6d240c369c1572b686ee2c95949d1042b5148de8eddebb4
    # Teto de memória: o clamd carrega a base de assinaturas (~1,5 GB) e não pode derrubar os demais serviços do WSL2.
    mem_limit: 2g
    cap_drop: [ALL]
    # O entrypoint da imagem (root) ajusta dono e permissões de /var/lib/clamav, /var/log/clamav e /run/clamav e rebaixa para o usuário clamav; sem estas
    # capacidades o container entra em loop de restart ou sobe sem log ("Operation not permitted").
    cap_add: [CHOWN, SETUID, SETGID, FOWNER, DAC_OVERRIDE]
    security_opt: ["no-new-privileges:true"]
    volumes:
      # Base de assinaturas atualizada pelo freshclam sobrevive ao restart.
      - clamav-db:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped

  web:
    build:
      context: cadastro-frontend
    # Teto de memória: um serviço não derruba os demais na VM do WSL2 (20 GB, ver ~/.wslconfig).
    mem_limit: 128m
    # Só na máquina local: a aplicação mostra dados pessoais e não deve ficar exposta na rede.
    ports:
      - "127.0.0.1:4300:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

networks:
  # Rede compartilhada com o Keycloak e o Legado (spec 001); criada por ./scripts/identity-network.sh.
  identity:
    name: workspace-identity
    external: true

volumes:
  api-keys:
  clamav-db:
